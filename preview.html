<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>废土战歌 - 游戏预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(90deg, #e8b830, #f4d03f, #e8b830);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(232, 184, 48, 0.3);
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .preview-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(232, 184, 48, 0.2);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text {
            color: #4ade80;
            font-size: 16px;
        }
        .port-info {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
            background: linear-gradient(90deg, #e8b830, #f4d03f);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(232, 184, 48, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 184, 48, 0.4);
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .feature-title {
            color: #e8b830;
            font-size: 14px;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">⚔️ 废土战歌</h1>
        <p class="subtitle">Wasteland Battle Song</p>
        
        <div class="preview-box">
            <div class="status">
                <div class="status-dot"></div>
                <span class="status-text">开发服务器运行中</span>
            </div>
            <p class="port-info">本地地址: http://localhost:5174</p>
            <a href="http://localhost:5174" class="btn" target="_blank">🎮 开始游戏</a>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🏜️</div>
                <div class="feature-title">废土探索</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚔️</div>
                <div class="feature-title">战斗系统</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚗</div>
                <div class="feature-title">战车改装</div>
            </div>
        </div>
        
        <p class="footer">点击上方按钮在新标签页打开游戏</p>
    </div>
</body>
</html>
